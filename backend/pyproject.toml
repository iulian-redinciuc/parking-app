[project]
name = "parking"
version = "0.1.0"
description = "Parking occupancy backend: vision workers, API and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12", "pydantic>=2.7", "pydantic-settings>=2.3", "pyyaml>=6",
  "numpy>=1.26", "shapely>=2.0", "opencv-python-headless>=4.10",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2.1",
  "sqlmodel>=0.0.21", "alembic>=1.13",
  "pywebpush>=2.0", "apscheduler>=3.10,<4", "argon2-cffi>=23.1", "limits>=3.13", "httpx>=0.27",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3", "lap>=0.5", "ncnn>=1.0.20240410", "pnnx>=20250530", "onnxruntime>=1.18",
  "torch>=2.4", "torchvision>=0.19",   # CPU-only wheels, see [tool.uv.sources]
  "gpiod>=2.2; sys_platform == 'linux'",   # barrier worker, `gpio:` source (libgpiod bundled)
]
openvino = ["openvino>=2024.3"]          # only if an Intel machine is chosen for production

[project.scripts]
parking = "parking.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# CPU-only PyTorch: the default PyPI wheels pull in gigabytes of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs the real model",
  "e2e: Docker Compose end-to-end test (PARKING_E2E=1)",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"  # tests/unit and tests/e2e both have a test_pipeline.py
