# Jobs from docs/design/testing.md §5 (+ Lighthouse CI, P3.10). Images are only built here;
# pushing them happens on release tags (release.yml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      images: ${{ steps.filter.outputs.images }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/**'
            images:
              - 'backend/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend/**'
              - 'tools/slot-editor/**'
              - 'deploy/Caddyfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --run
      - run: npm run build
      - name: Slot editor (lint, format, unit tests)
        working-directory: .
        run: |
          frontend/node_modules/.bin/eslint tools/slot-editor
          frontend/node_modules/.bin/prettier --config frontend/.prettierrc.json --check tools/slot-editor
          node --test tools/slot-editor/editor.test.js
      - name: Flow tally (lint, format, unit tests)
        working-directory: .
        run: |
          frontend/node_modules/.bin/eslint tools/flow-tally
          frontend/node_modules/.bin/prettier --config frontend/.prettierrc.json --check tools/flow-tally
          node --test tools/flow-tally/tally.test.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  lighthouse:
    # Lighthouse CI on the mock-mode preview build (frontend/lighthouserc.cjs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --mode development
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/reports
          include-hidden-files: true
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  e2e:
    # Docker Compose end-to-end test (P2.11): replay worker -> API -> /api/stream
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest tests/e2e -v -s
        env:
          PARKING_E2E: "1"

  images:
    # Both images on both CPU types, without pushing: catches "works on the Pi, breaks on x86"
    # (and the reverse). Native runners per CPU type; the release build is the multi-arch one.
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        target: [api, vision]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: parking-${{ matrix.target }}:ci
      - run: docker run --rm --entrypoint /app/backend/.venv/bin/parking parking-${{ matrix.target }}:ci --version

  web-image:
    # The production web image (Caddy + the built frontend, deployment.md §5 Option B) on both CPU
    # types, without pushing: the proxy rules parse and the frontend is in it.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: web
          push: false
          load: true
          tags: parking-web:ci
      - run: docker run --rm parking-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker run --rm parking-web:ci test -s /srv/index.html
