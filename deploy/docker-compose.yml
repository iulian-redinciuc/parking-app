# Base Compose definition (released images from GHCR). Spec: docs/design/deployment.md §4
#   cp .env.example .env   # then fill in WORKER_TOKEN etc.; .env is git-ignored
#   docker compose up -d
# Dev Pi (builds the images locally): add  -f docker-compose.dev.yml
# Isolation (deployment.md §1.1): project "parking", its own networks, API on loopback only.
# Public entry (deployment.md §5 Option A): only while testing,
#   docker compose --profile public up -d   ...   docker compose --profile public down
# Dev phone testing without a domain (quick tunnel, P3.9): scripts/dev-public.sh up | down | url
# Entry/exit camera (Phase 5): docker compose --profile flow up -d
name: parking

# Hardening (P8.4, deployment.md §4.1): read-only root filesystem, no capabilities, no privilege gain,
# not root. /tmp is memory (it counts towards the service's memory limit).
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "1000:1000"                                            # the owner of config/, data/, models/

# cloudflared's image is distroless and runs as its own user "nonroot"
x-hardening-tunnel: &hardening-tunnel
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "65532:65532"
  deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
  healthcheck:                                                 # connected to Cloudflare's edge
    test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
    start_interval: 2s

# Workers (P8.5, deployment.md §4.2): healthy while the loop's heartbeat file is fresh. A stuck loop is
# unhealthy within ~40 s and `autoheal` restarts the container.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "/app/backend/.venv/bin/python", "-m", "parking.workers.heartbeat"]
  interval: 10s
  timeout: 5s
  retries: 2
  start_period: 60s
  start_interval: 2s

x-common: &common
  <<: *hardening
  env_file: .env
  restart: unless-stopped
  volumes:
    - ../config:/app/config
    - ../data:/app/data
    - ../models:/app/models:ro
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  api:
    <<: *common
    container_name: parking-api
    image: ghcr.io/iulian-redinciuc/parking-api:${PARKING_VERSION:-latest}
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]          # loopback only
    networks: [internal, egress]                               # egress: Web Push
    deploy: { resources: { limits: { cpus: "${API_CPUS:-1.0}", memory: "${API_MEMORY:-512M}" } } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  vision-occupancy:
    <<: *common
    container_name: parking-vision-occupancy
    image: ghcr.io/iulian-redinciuc/parking-vision:${PARKING_VERSION:-latest}
    command: ["occupancy", "--camera", "cam-ground"]
    networks: [internal, egress]                               # egress: reach the camera
    deploy: { resources: { limits: { cpus: "${VISION_CPUS:-1.0}", memory: "${VISION_MEMORY:-1200M}" } } }
    environment: { OMP_NUM_THREADS: "2", API_INTERNAL_URL: "${API_INTERNAL_URL:-http://api:8000}" }
    depends_on:
      api: { condition: service_healthy }
    healthcheck: *worker-healthcheck
    labels: { parking.autoheal: "true" }                       # restarted when unhealthy (autoheal)

  vision-flow:
    <<: *common
    container_name: parking-vision-flow
    image: ghcr.io/iulian-redinciuc/parking-vision:${PARKING_VERSION:-latest}
    command: ["flow", "--camera", "cam-ramp"]
    profiles: ["flow"]                                         # enabled from Phase 5
    networks: [internal, egress]                               # egress: reach the camera
    deploy: { resources: { limits: { cpus: "${FLOW_CPUS:-1.5}", memory: "${FLOW_MEMORY:-1200M}" } } }
    environment: { OMP_NUM_THREADS: "2", API_INTERNAL_URL: "${API_INTERNAL_URL:-http://api:8000}" }
    depends_on:
      api: { condition: service_healthy }
    healthcheck: *worker-healthcheck
    labels: { parking.autoheal: "true" }                       # restarted when unhealthy (autoheal)

  # Docker never restarts an unhealthy container by itself. This one does, for the containers
  # labelled parking.autoheal=true only. It talks to the Docker socket, so: pinned, no network.
  autoheal:
    <<: *hardening
    container_name: parking-autoheal
    image: willfarrell/autoheal:1.2.0
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env to the docker group's id (getent group docker | cut -d: -f3)}"]
    environment:
      AUTOHEAL_CONTAINER_LABEL: parking.autoheal
      AUTOHEAL_INTERVAL: "5"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.2", memory: 64M } } }
    healthcheck:                                               # the Docker socket answers
      test: ["CMD", "curl", "-sf", "--max-time", "3", "--unix-socket", "/var/run/docker.sock", "http://localhost/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  tunnel:
    <<: *hardening-tunnel
    container_name: parking-tunnel
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --metrics localhost:20241 run
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}" }
    restart: unless-stopped
    networks: [internal, egress]                               # internal: reach api:8000
    profiles: ["public"]
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  tunnel-quick:                                                # dev only: random trycloudflare.com address
    <<: *hardening-tunnel
    container_name: parking-tunnel-quick
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate --metrics localhost:20241 --config /etc/cloudflared/config.yml --url http://api:8000
    volumes:
      - ./cloudflared-quick.yml:/etc/cloudflared/config.yml:ro # only /api/* and /healthz
    restart: unless-stopped
    networks: [internal, egress]                               # internal: reach api:8000
    profiles: ["quick"]
    depends_on:
      api: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  internal: { internal: true }
  egress: {}
