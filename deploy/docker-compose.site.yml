# T2 lot box (vision host): vision workers only. Spec: docs/design/deployment.md §4, §9
#   cd /opt/parking/deploy                       # .env from scripts/prod-env.sh site
#   PARKING_VERSION=v0.x.y docker compose -f docker-compose.site.yml up -d
# Entry/exit camera (Phase 5): add  --profile flow
# Barrier contacts (P9.3):     add  -f docker-compose.barrier.yml --profile barrier
# Workers send results to the API over the private VPN (API_INTERNAL_URL=http://<server-vpn-address>:8000)
# and the API reaches their /control/* at this machine's VPN address: occupancy on port 9000, flow on
# 9001 (cameras[].control_url in the server's lot.yaml). Nothing is published on the LAN or the internet.
# Published ports bypass ufw: the bind address is the protection.
name: parking

# Hardening (P8.4, deployment.md §4.1): read-only root filesystem, no capabilities, no privilege gain,
# not root. /tmp is memory (it counts towards the service's memory limit).
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "1000:1000"                                            # the owner of config/, data/, models/

x-worker: &worker
  <<: *hardening
  image: ghcr.io/iulian-redinciuc/parking-vision:${PARKING_VERSION:?set PARKING_VERSION to a release tag (v0.x.y)}
  env_file: .env
  restart: unless-stopped
  volumes:
    - ../config:/app/config
    - ../data:/app/data
    - ../models:/app/models:ro
  networks: [egress]                                           # the cameras and the VPN
  environment:
    OMP_NUM_THREADS: "2"
    API_INTERNAL_URL: "${API_INTERNAL_URL:?set API_INTERNAL_URL to http://<server-vpn-address>:8000}"
  # P8.5, deployment.md §4.2: healthy while the loop's heartbeat file is fresh. A stuck loop is unhealthy
  # within ~40 s and `autoheal` restarts the container.
  healthcheck:
    test: ["CMD", "/app/backend/.venv/bin/python", "-m", "parking.workers.heartbeat"]
    interval: 10s
    timeout: 5s
    retries: 2
    start_period: 60s
    start_interval: 2s
  labels: { parking.autoheal: "true" }                         # restarted when unhealthy (autoheal)
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  vision-occupancy:
    <<: *worker
    container_name: parking-vision-occupancy
    command: ["occupancy", "--camera", "cam-ground"]
    ports: ["${VPN_BIND_IP:?set VPN_BIND_IP to this machine's VPN address}:9000:9000"]
    deploy: { resources: { limits: { cpus: "${VISION_CPUS:-1.0}", memory: "${VISION_MEMORY:-1200M}" } } }

  vision-flow:
    <<: *worker
    container_name: parking-vision-flow
    command: ["flow", "--camera", "cam-ramp"]
    profiles: ["flow"]                                         # enabled from Phase 5
    ports: ["${VPN_BIND_IP:?set VPN_BIND_IP to this machine's VPN address}:9001:9000"]
    deploy: { resources: { limits: { cpus: "${FLOW_CPUS:-1.5}", memory: "${FLOW_MEMORY:-1200M}" } } }

  barrier:                                                     # a barrier's contacts (barrier.md)
    <<: *worker
    container_name: parking-barrier
    command: ["barrier", "--camera", "barrier-ramp"]
    profiles: ["barrier"]
    deploy: { resources: { limits: { cpus: "0.25", memory: 256M } } }

  # Docker never restarts an unhealthy container by itself. This one does, for the containers
  # labelled parking.autoheal=true only. It talks to the Docker socket, so: pinned, no network.
  autoheal:
    <<: *hardening
    container_name: parking-autoheal
    image: willfarrell/autoheal:1.2.0
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env to the docker group's id (getent group docker | cut -d: -f3)}"]
    environment:
      AUTOHEAL_CONTAINER_LABEL: parking.autoheal
      AUTOHEAL_INTERVAL: "5"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.2", memory: 64M } } }
    healthcheck:                                               # the Docker socket answers
      test: ["CMD", "curl", "-sf", "--max-time", "3", "--unix-socket", "/var/run/docker.sock", "http://localhost/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  egress: {}
